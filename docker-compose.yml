services:
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    image: ai-cto-orchestrator:latest
    container_name: ai-cto-orchestrator
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/orchestrator.db}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKSPACES_ROOT: ${WORKSPACES_ROOT:-/app/projects}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./projects:/app/projects
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped